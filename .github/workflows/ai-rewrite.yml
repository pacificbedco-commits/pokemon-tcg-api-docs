name: AI Rewrite Docs

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Relative path to doc file to rewrite (e.g. docs/intro.mdx). Leave empty to rewrite all docs.'
        required: false
        default: ''

jobs:
  ai-rewrite:
    runs-on: ubuntu-latest
    if: vars.AI_REWRITE_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Rewrite docs with AI
        env:
          AI_REWRITE_API_KEY: ${{ secrets.AI_REWRITE_API_KEY }}
          AI_REWRITE_MODEL: ${{ vars.AI_REWRITE_MODEL || 'gpt-4o-mini' }}
          AI_REWRITE_ENDPOINT: ${{ vars.AI_REWRITE_ENDPOINT || 'https://api.openai.com/v1/chat/completions' }}
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import glob

          api_key = os.environ["AI_REWRITE_API_KEY"]
          model = os.environ["AI_REWRITE_MODEL"]
          endpoint = os.environ["AI_REWRITE_ENDPOINT"]
          target = os.environ.get("TARGET_FILE", "").strip()

          if target:
              files = [target] if os.path.isfile(target) else []
          else:
              files = glob.glob("docs/**/*.md", recursive=True) + glob.glob("docs/**/*.mdx", recursive=True)

          if not files:
              print("No files found to rewrite.")
              exit(0)

          headers = {
              "Authorization": f"******",
              "Content-Type": "application/json",
          }

          SYSTEM_PROMPT = (
              "You are a technical documentation editor. "
              "Rewrite the provided Markdown/MDX documentation to be clearer, more concise, "
              "and better structured. Preserve all headings, code blocks, links, and frontmatter exactly. "
              "Only improve prose text. Return only the rewritten document with no explanation."
          )

          for filepath in files:
              print(f"Rewriting: {filepath}")
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": SYSTEM_PROMPT},
                      {"role": "user", "content": content},
                  ],
                  "temperature": 0.3,
              }

              response = requests.post(endpoint, headers=headers, json=payload, timeout=60)
              response.raise_for_status()
              rewritten = response.json()["choices"][0]["message"]["content"]

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(rewritten)
              print(f"Done: {filepath}")

          print("All files rewritten.")
          EOF

      - name: Commit rewritten docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: AI rewrite via ${{ vars.AI_REWRITE_MODEL || 'gpt-4o-mini' }} [skip ci]"
            git push
          fi
